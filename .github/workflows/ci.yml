name: 离线测试与安全审计

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: 运行离线测试
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: 审计已跟踪文件
        run: python scripts/audit_public_commit.py --mode tracked
